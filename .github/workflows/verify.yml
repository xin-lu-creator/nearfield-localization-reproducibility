name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_release.py
      - run: python scripts/smoke_test.py
      - run: python verification/fisher_information.py
      - run: python verification/werner_jansson_equivalence.py
      - run: python verification/design_bound.py
      - run: python verification/optimization_audit.py
      - run: python verification/nearfield_geometry.py
      - run: python verification/verify_wsf_and_diffuse.py
